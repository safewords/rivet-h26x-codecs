[package]
name = "rivet-h26x"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/safewords/rivet-h26x-codecs"
homepage = "https://github.com/safewords/rivet-h26x-codecs"
documentation = "https://docs.rs/rivet-h26x"
authors = ["Ely Erin Fox"]
description = "Native H.264/AVC and H.265/HEVC decoders in Rust — no C, no system libraries, no build script — bit-exact against the JVT / JCT-VC conformance suites, frame- and wavefront-threaded, with a runtime-dispatched kernel ladder from SSE2 to AVX-512 and NEON. rivet's software decode tier. Imported as `h26x`."
keywords = ["h264", "hevc", "h265", "video", "decoder"]
categories = ["multimedia::video", "multimedia::encoding"]
exclude = [".github/", "docs/", "tools/"]

[lib]
name = "h26x"

[dependencies]
thiserror = "2"

[dev-dependencies]
md5 = "0.7"

[features]
default = []

# Built as a cdylib so `tools/wasm.sh` can instantiate it: wasm32 has no test
# harness, so this is the only way to check that the decoder decodes there
# rather than merely compiles.
[[example]]
name = "h26x_wasm_probe"
crate-type = ["cdylib"]
