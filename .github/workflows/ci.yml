name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

# Every job runs on the safewords org's self-hosted runners
# (`safewords-runners`), pull requests from forks included: an outside
# contributor's workflow runs only once a maintainer approves it. CI is
# x86-64 Linux only. No Windows, macOS or arm64 jobs: the code stays
# portable, and the NEON (aarch64) paths are checked by hand on ARM hardware
# (README, "NEON on ARM hardware").

# id-token: a push to develop or main shows the compile cache's broker its
# OIDC token to be allowed to write the cache (ci-cache-setup).
permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SIMD kernels are checked bit-exact against the scalar
          # reference: AVX2 on x86-64 (NEON, and its dotprod rung, are
          # checked by hand on ARM hardware, see the README).
          - { name: linux x86-64 (AVX2), os: safewords-runners }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - name: Build (lib + examples)
        run: cargo build --release --examples
      - name: Tests
        run: cargo test --release
      - name: Tests on the scalar reference
        # The kernel tests compare every rung with the scalar reference
        # explicitly; this runs the decoders and encoders themselves with
        # the SIMD tables off (H26X_NO_SIMD), so the scalar paths decode
        # the vendored streams to their recorded hashes too.
        run: cargo test --release
        env:
          H26X_NO_SIMD: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo build --release

  lint:
    name: rustfmt, clippy and rustdoc
    runs-on: safewords-runners
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  reference:
    name: against the ITU-T reference decoders (JM, HM)
    # The vendored streams (tests/decode.rs) and an encode round trip,
    # decoded by JM's ldecod and HM's TAppDecoder — run as programs — and
    # compared with this crate's decoder picture for picture. The tests'
    # expected hashes were computed from these decoders' output; this job
    # re-checks that on every push. No FFmpeg anywhere.
    runs-on: safewords-runners
    env:
      JM_REF: master
      HM_REF: HM-18.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile cache
        # sccache on the cluster's Garage (safewords/helm-charts ci-cache):
        # read-only for pull requests, written by pushes to develop / main.
        run: if command -v ci-cache-setup >/dev/null; then ci-cache-setup; else echo "no compile cache on this runner"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Cache the reference decoders
        id: refcache
        uses: actions/cache@v4
        with:
          path: ~/refdec
          key: refdec-${{ runner.os }}-jm-${{ env.JM_REF }}-hm-${{ env.HM_REF }}-v1
      - name: Build JM and HM
        if: steps.refcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/refdec ~/src && cd ~/src
          git clone --depth 1 --branch "$JM_REF" https://vcgit.hhi.fraunhofer.de/jvet/JM.git
          git clone --depth 1 --branch "$HM_REF" https://vcgit.hhi.fraunhofer.de/jvet/HM.git
          # -w: the reference software builds with -Werror, and a newer gcc
          # warns where theirs did not; the warnings are not ours to fix.
          cmake -S JM -B JM/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-w -DCMAKE_CXX_FLAGS=-w
          cmake --build JM/build --config Release --target ldecod -j 4
          cmake -S HM -B HM/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-w -DCMAKE_CXX_FLAGS=-w
          cmake --build HM/build --config Release --target TAppDecoder -j 4
          cp "$(find JM/bin -type f -name ldecod | head -1)" ~/refdec/
          cp "$(find HM/bin -type f -name TAppDecoder | head -1)" ~/refdec/
          ls -l ~/refdec
      - name: Build the decoder and encoder
        run: cargo build --release --examples
      - name: The vendored streams against JM / HM
        env:
          LDECOD: /home/runner/refdec/ldecod
          TAPPDECODER: /home/runner/refdec/TAppDecoder
        run: python tools/ref_decode.py check --dec target/release/examples/h26xdec tests/data/tiny_cabac.264 tests/data/tiny_cavlc.264 tests/data/tiny.265
      - name: Encode round trip against JM / HM
        env:
          LDECOD: /home/runner/refdec/ldecod
          TAPPDECODER: /home/runner/refdec/TAppDecoder
        run: bash tools/ref_roundtrip.sh target/release/examples/h26xenc target/release/examples/h26xdec

  # rivet's compile cache, warmed with this commit before rivet's submodule is
  # bumped to it: the commit built inside rivet exactly as rivet's CI builds
  # it (safewords/rivet-transcoder .github/workflows/codec-cache-warmup.yml).
  # Never fails this workflow.
  rivet-cache:
    name: warm rivet's compile cache
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    uses: safewords/rivet-transcoder/.github/workflows/codec-cache-warmup.yml@develop
    with:
      crates: rivet-h26x
      submodule: crates/h26x
