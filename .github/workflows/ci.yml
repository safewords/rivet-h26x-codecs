name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The SIMD kernels are checked bit-exact against the scalar
          # reference on every host: AVX2 on x86-64, NEON on arm64.
          # `require` names a SIMD rung the host is expected to have, so the
          # tests for it fail rather than skip if a runner ever loses it —
          # a skipped kernel test is indistinguishable from a passing one.
          - { name: linux x86-64 (AVX2), os: ubuntu-latest }
          - { name: linux arm64 (NEON),  os: ubuntu-24.04-arm, require: dotprod }
          - { name: windows x86-64,      os: windows-latest }
          - { name: macos arm64 (NEON),  os: macos-latest,     require: dotprod }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (lib + examples)
        run: cargo build --release --examples
      - name: Tests
        run: cargo test --release
        env:
          H26X_REQUIRE_DOTPROD: ${{ matrix.require == 'dotprod' && '1' || '' }}
      - name: Tests on the scalar reference
        # The kernel tests compare every rung with the scalar reference
        # explicitly; this runs the decoders and encoders themselves with
        # the SIMD tables off (H26X_NO_SIMD), so the scalar paths decode
        # the vendored streams to their recorded hashes too.
        run: cargo test --release
        env:
          H26X_NO_SIMD: "1"

  msrv:
    name: MSRV (1.99)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  reference:
    name: against the ITU-T reference decoders (JM, HM)
    # The vendored streams (tests/decode.rs) and an encode round trip,
    # decoded by JM's ldecod and HM's TAppDecoder — run as programs — and
    # compared with this crate's decoder picture for picture. The tests'
    # expected hashes were computed from these decoders' output; this job
    # re-checks that on every push. No FFmpeg anywhere.
    runs-on: ubuntu-latest
    env:
      JM_REF: master
      HM_REF: HM-18.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Cache the reference decoders
        id: refcache
        uses: actions/cache@v4
        with:
          path: ~/refdec
          key: refdec-${{ runner.os }}-jm-${{ env.JM_REF }}-hm-${{ env.HM_REF }}-v1
      - name: Build JM and HM
        if: steps.refcache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/refdec ~/src && cd ~/src
          git clone --depth 1 --branch "$JM_REF" https://vcgit.hhi.fraunhofer.de/jvet/JM.git
          git clone --depth 1 --branch "$HM_REF" https://vcgit.hhi.fraunhofer.de/jvet/HM.git
          # -w: the reference software builds with -Werror, and a newer gcc
          # warns where theirs did not; the warnings are not ours to fix.
          cmake -S JM -B JM/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-w -DCMAKE_CXX_FLAGS=-w
          cmake --build JM/build --config Release --target ldecod -j 4
          cmake -S HM -B HM/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS=-w -DCMAKE_CXX_FLAGS=-w
          cmake --build HM/build --config Release --target TAppDecoder -j 4
          cp "$(find JM/bin -type f -name ldecod | head -1)" ~/refdec/
          cp "$(find HM/bin -type f -name TAppDecoder | head -1)" ~/refdec/
          ls -l ~/refdec
      - name: Build the decoder and encoder
        run: cargo build --release --examples
      - name: The vendored streams against JM / HM
        env:
          LDECOD: /home/runner/refdec/ldecod
          TAPPDECODER: /home/runner/refdec/TAppDecoder
        run: python tools/ref_decode.py check --dec target/release/examples/h26xdec tests/data/tiny_cabac.264 tests/data/tiny_cavlc.264 tests/data/tiny.265
      - name: Encode round trip against JM / HM
        env:
          LDECOD: /home/runner/refdec/ldecod
          TAPPDECODER: /home/runner/refdec/TAppDecoder
        run: bash tools/ref_roundtrip.sh target/release/examples/h26xenc target/release/examples/h26xdec
